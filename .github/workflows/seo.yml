# Rebuilds the invisible SEO/AI-metadata layer on every push and deploys the
# verified result to GitHub Pages. Nothing is committed back to main.
#
# Owner's workflow stays: edit files -> git push. A new paper folder gets
# baseline coverage (canonical, OG, JSON-LD, sitemap, llms.txt) automatically;
# the run then turns RED as a reminder to enrich tools/papers.json (Scholar
# tags need reviewed authors/year). The generator's own exit is absorbed by
# continue-on-error, but Verify is not, and it fails on the same gap before
# Configure Pages — so a page missing from papers.json does NOT deploy.
name: seo-build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-based sitemap lastmod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check the tools before running them
        # generate_seo.py runs with continue-on-error so that a page still awaiting
        # papers.json metadata (a deliberate exit 1) does not block a deploy. That
        # also swallowed a real SyntaxError once. Compiling first separates the two:
        # a broken tool fails the run outright, missing metadata still deploys.
        run: python -m py_compile tools/generate_seo.py tools/verify_seo.py komentare/build.py
      - name: Generate metadata layer (idempotent, in checkout only)
        id: gen
        run: python tools/generate_seo.py
        continue-on-error: true
      - name: Verify the self-managed commentary section
        # verify_seo.py deliberately skips /komentare/ (it manages its own metadata),
        # which left that section unvalidated. This closes the hole.
        run: python komentare/build.py --check
      - name: Verify (visible content unchanged, JSON-LD valid, URLs resolve)
        run: python tools/verify_seo.py
      # The data layer's own gate. It checks what verify_seo cannot see: duplicate
      # literatures, unit violations, implausible sample sizes, direction notes that
      # contradict their data, advertised URLs, parquet/csv agreement. It ran only in
      # the local pre-push hook, so a push from anywhere else was unprotected by the
      # strongest verifier in the repo.
      - name: Install the data-layer's dependencies
        run: python -m pip install --quiet pandas pyarrow
      - name: Verify the data layer
        run: python data_layer/09_verify.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      # Answers the one question the rest of this workflow structurally cannot: what is
      # actually being SERVED. Three separate reviews have reported "production is stale"
      # when it was not -- every one a crawler cache -- and disproving each cost two
      # sessions measuring by hand. Fetches the public domain cache-busted. Standard
      # library only, so it needs no extra install. (redesign/audit.py --live is the
      # richer local tool; it lives outside this repository, which is why CI uses this.)
      - name: Post-deploy smoke test
        run: |
          sleep 45
          for i in 1 2 3; do
            python tools/smoke_live.py && exit 0
            echo "smoke test attempt $i failed; Pages may still be propagating"
            sleep 30
          done
          echo "::error::Post-deploy smoke test failed after 3 attempts - the deployed site does not match what was pushed"
          exit 1

      - name: Ping IndexNow with changed URLs (best effort)
        continue-on-error: true
        run: |
          KEY=$(basename $(ls ./*.txt | grep -E '/[0-9a-f]{32}\.txt$') .txt)
          # diff the whole push range (before..sha), not just the last commit
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null | grep -E 'index\.html|\.pdf$' | head -40 || true)
          URLS='"https://meta-analysis.cz/"'
          for f in $CHANGED; do
            # root index.html -> canonical "/", project index.html -> "proj/"
            if [ "$f" = "index.html" ]; then continue; fi
            u=$(echo "$f" | sed 's|/index.html$|/|')
            URLS="$URLS, \"https://meta-analysis.cz/$u\""
          done
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"meta-analysis.cz\",\"key\":\"$KEY\",\"urlList\":[$URLS]}" || true
      - name: Metadata enrichment audit
        if: steps.gen.outcome == 'failure'
        run: |
          # Reached only when the generator warned AND everything after it passed, so the
          # deploy did happen. A papers.json gap fails Verify instead and never gets here.
          echo "::error::The metadata generator raised warnings (see 'Generate metadata layer' log). The site deployed with baseline coverage, but the warning needs clearing — usually a page missing from tools/papers.json, whose Google Scholar tags require reviewed authors and year."
          exit 1
