# Rebuilds the invisible SEO/AI-metadata layer on every push and deploys the
# verified result to GitHub Pages. Nothing is committed back to main.
#
# Owner's workflow stays: edit files -> git push. A new paper folder gets
# baseline coverage (canonical, OG, JSON-LD, sitemap, llms.txt) automatically;
# the run then turns RED as a reminder to enrich tools/papers.json (Scholar
# tags need reviewed authors/year). The generator's own exit is absorbed by
# continue-on-error, but Verify is not, and it fails on the same gap before
# Configure Pages — so a page missing from papers.json does NOT deploy.
name: seo-build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-based sitemap lastmod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check the tools before running them
        # generate_seo.py runs with continue-on-error so that a page still awaiting
        # papers.json metadata (a deliberate exit 1) does not block a deploy. That
        # also swallowed a real SyntaxError once. Compiling first separates the two:
        # a broken tool fails the run outright, missing metadata still deploys.
        run: python -m py_compile tools/generate_seo.py tools/verify_seo.py komentare/build.py
      - name: Generate metadata layer (idempotent, in checkout only)
        id: gen
        run: python tools/generate_seo.py
        continue-on-error: true
      - name: Verify the self-managed commentary section
        # verify_seo.py deliberately skips /komentare/ (it manages its own metadata),
        # which left that section unvalidated. This closes the hole.
        run: python komentare/build.py --check
      - name: Verify (visible content unchanged, JSON-LD valid, URLs resolve)
        run: python tools/verify_seo.py
      # The data layer's own gate. It checks what verify_seo cannot see: duplicate
      # literatures, unit violations, implausible sample sizes, direction notes that
      # contradict their data, advertised URLs, parquet/csv agreement. It ran only in
      # the local pre-push hook, so a push from anywhere else was unprotected by the
      # strongest verifier in the repo.
      - name: Install the data-layer's dependencies
        # PINNED, not `pip install pandas pyarrow`. pyarrow writes its version into every
        # Parquet `created_by` and pandas into the metadata blob, so an unpinned install moves
        # 47 of 160 output files' checksums without a single value changing -- which tells
        # anyone who pinned a hash that the data moved when it did not. The file also pins
        # xlrd and openpyxl, without which 06_convert fails on 12 of the 45 datasets.
        run: python -m pip install --quiet -r data_layer/requirements-pinned.txt
      - name: Verify the data layer
        run: python data_layer/09_verify.py

      # tools/check_evidence.py imports the page builder, and the builder converts LaTeX to
      # MathML. That dependency was not installed here, so adding the step below broke the
      # build -- and with it the deploy -- for two commits before this line existed.
      - name: Install the site builders' dependencies
        run: python -m pip install --quiet -r tools/requirements-pinned.txt

      # Provenance of the headline results. estimates.csv says source_quote is the sentence
      # each headline figure came from; now that every paper is HTML that claim is checkable,
      # and it is checked. The ten it cannot confirm are recorded with a reason in
      # tools/evidence_exceptions.json, so this fails on a NEW one rather than on the backlog.
      - name: Verify the headline evidence
        run: python tools/check_evidence.py

      # Every DOI attached to a reference that was printed without one. The check re-applies
      # the acceptance rule from the stored record rather than trusting the matcher's verdict,
      # and refuses an entry whose text no longer matches a reference on the site -- so an
      # edited reference list drops its links instead of keeping them on the wrong entries.
      - name: Verify the matched reference DOIs
        run: python tools/check_reference_dois.py

      # The site searches itself from a prebuilt index, so the index is only as true as the
      # last time somebody rebuilt it. An index built from yesterday's pages returns pages
      # that have moved on and misses the ones added since -- worse than no index, because
      # it looks like it worked. This fails the build instead.
      - name: Require the search index to match the pages it indexes
        run: python tools/build_search_index.py --check

      # /maive/how-to/ prints numbers that came from somebody else's service. The requests and
      # the full responses are recorded in api/v1/maive-howto.json, and this proves the page is
      # exactly what that file renders, that the settings the page teaches are the settings
      # that ran, and that the WAIVE run is not MAIVE in disguise. Offline: it never calls the
      # API on a push. The live re-run is a separate, weekly, non-blocking job.
      - name: Verify the MAIVE how-to against its recorded runs
        run: python tools/check_maive_howto.py

      # papers.json is the map AI agents are told to fetch first. It went stale once: it
      # carried section anchors from before the endnotes repair, with a clean CI. This
      # rebuilds it in memory and fails on any drift or duplicate anchor.
      - name: Verify api/v1/papers.json against a fresh build
        run: python tools/build_papers_api.py --check

      # The two publication lists are generated from tools/publications.json and were
      # gated only by hand, which is how a row once carried the wrong year and a full-text
      # link belonging to a different paper: a title was matched on a 45-character prefix,
      # and "Reporting Guidelines for Meta-Analysis in Economics" is a prefix of the 2026
      # "...Updated for AI". The builder now audits before it writes (order, duplicate
      # DOIs, links justified by DOI or WHOLE title, years agreeing with the site, no
      # empty author list, and the two lists agreeing about any paper on both), and
      # --check additionally refuses a page that is stale against publications.json.
      - name: Verify the publication lists against a fresh build
        run: python tools/build_publications_page.py --check

      # /papers/ is the site's index of the full-text editions, linked from every footer,
      # and nothing was gating it: it goes one paper short the moment a paper is added, and
      # the sentence describing which papers carry no headline result stays behind the list
      # it describes. Both happened before this gate existed.
      - name: Verify /papers/ against a fresh build
        run: python tools/build_fulltext_page.py --check

      # The full-text corpus itself: figures, tables, fragment links, MathML, coverage.
      # This class of checker has caught real user-facing failures (a missing figure,
      # fragmented tables); it passes clean in about four minutes.
      - name: Verify the full-text pages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python tools/check_paper_pages.py

      # The full-text pages themselves are the largest thing this site publishes and were
      # the one generated artifact with no --check gate: nothing here or in the pre-push
      # hook rebuilt them, so a page that stopped following from its transcript would have
      # deployed unremarked. verify_seo.py does not cover this. It compares each page to
      # git HEAD to prove generate_seo.py did not rewrite prose, and by construction cannot
      # see a page that was already stale when it was committed.
      #
      # AFTER the poppler install above, and it has to be. build_paper_page decides whether
      # a paper sets its headings with a vertical rule by running pdftotext over the first
      # twelve pages, and returns False if that raises. Without poppler the answer is False
      # for every paper, and the two whose PDFs really do print pipe headings, activism and
      # pcc, rebuild 12 and 22 bytes short of what is committed. Run earlier, this gate
      # fails on a missing dependency and calls it drift.
      - name: Verify the full-text pages against a fresh build
        run: python tools/build_paper_page.py --all --check

      # Sentences the conversion cut in half. The fidelity checker above cannot see these:
      # every word is present and none is invented, so a paragraph that stops mid-clause
      # passes it. Three separate hand audits found this class and none of them found all of
      # it. The screen reads tools/continuity_reviewed.json, where every kept boundary names
      # what its source page prints, and fails on anything not in that list.
      - name: Check paragraph continuity
        run: python tools/audit_continuity.py

      # Did this push touch the data layer? 09_verify proves the tree is internally
      # CONSISTENT; it cannot prove the tree FOLLOWS FROM its canonical inputs. A tree can be
      # perfectly self-consistent and still stale, which is exactly what happened four times in
      # one session when a fix landed in a source file and not in its generated copy, with every
      # gate green each time. The rebuild below closes that, but it is scoped: a prose or styling
      # commit must not wait on a pipeline rebuild, nor be blocked by an unrelated pipeline
      # failure. That was the standing objection to gating on this at all.
      - name: Rebuild the data layer and require zero drift
        # BLOCKING, before Configure Pages, so a tree that does not reproduce from its inputs
        # does not deploy. Roughly 40 seconds, byte-identical on Python 3.11 and 3.12 given
        # the pins above.
        #
        # It runs on EVERY push, not only pushes that touch data. A path filter looked cheaper
        # and had a hole: it tested the PUSH RANGE, not the state of the tree, so a data commit
        # that failed the gate would sail out on the next unrelated prose commit, unverified.
        #
        # The build ORDER lives in data_layer/rebuild.py and only there. It used to be spelled
        # out here as well, and in data_layer/README.md, and in whatever the person at the
        # keyboard remembered -- three copies of a sequence whose steps fail silently when
        # reversed. --check rebuilds, compares, deletes its own scratch and exits non-zero on
        # drift; it never writes to the published tree.
        run: python data_layer/rebuild.py --check --data

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      # Answers the one question the rest of this workflow structurally cannot: what is
      # actually being SERVED. Three separate reviews have reported "production is stale"
      # when it was not -- every one a crawler cache -- and disproving each cost two
      # sessions measuring by hand. Fetches the public domain cache-busted. Standard
      # library only, so it needs no extra install. (redesign/audit.py --live is the
      # richer local tool; it lives outside this repository, which is why CI uses this.)
      - name: Post-deploy smoke test
        run: |
          sleep 45
          for i in 1 2 3; do
            python tools/smoke_live.py && exit 0
            echo "smoke test attempt $i failed; Pages may still be propagating"
            sleep 30
          done
          echo "::error::Post-deploy smoke test failed after 3 attempts - the deployed site does not match what was pushed"
          exit 1

      - name: Ping IndexNow with changed URLs (best effort)
        continue-on-error: true
        run: |
          KEY=$(basename $(ls ./*.txt | grep -E '/[0-9a-f]{32}\.txt$') .txt)
          # diff the whole push range (before..sha), not just the last commit
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null | grep -E 'index\.html|\.pdf$' | head -40 || true)
          URLS='"https://meta-analysis.cz/"'
          for f in $CHANGED; do
            # root index.html -> canonical "/", project index.html -> "proj/"
            if [ "$f" = "index.html" ]; then continue; fi
            u=$(echo "$f" | sed 's|/index.html$|/|')
            URLS="$URLS, \"https://meta-analysis.cz/$u\""
          done
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"meta-analysis.cz\",\"key\":\"$KEY\",\"urlList\":[$URLS]}" || true
      - name: Metadata enrichment audit
        if: steps.gen.outcome == 'failure'
        run: |
          # Reached only when the generator warned AND everything after it passed, so the
          # deploy did happen. A papers.json gap fails Verify instead and never gets here.
          echo "::error::The metadata generator raised warnings (see 'Generate metadata layer' log). The site deployed with baseline coverage, but the warning needs clearing — usually a page missing from tools/papers.json, whose Google Scholar tags require reviewed authors and year."
          exit 1
