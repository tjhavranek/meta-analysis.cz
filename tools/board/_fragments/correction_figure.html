<figcaption class="table-note"><b>What correction and best practice did to the number.</b> One dot per meta-analysis, placed by how far its corrected or best-practice estimate sits from the mean the literature reported. <b>Red</b>: smaller <i>in absolute magnitude</i>. <b>Green</b>: larger. <b>25 of the 32</b> moved toward zero and <b>6</b> away from it. <b>1</b> did not move. The median revision is <b>-46%</b>. structural reforms is drawn at the right-hand edge: its <b>+631%</b> is off the scale. The 19 drawn as rings are approximate pairs. Vertical position carries no meaning. The dots are stacked only to keep them apart.<details class="figmethod"><summary>How this figure is built, and which papers it leaves out</summary><p>The index is <i>(|corrected| &minus; |mean|) / |mean|</i>, the same relative revision as Table 3 of <a href="/conventional_wisdom/">Gechert et al. (2025)</a>, which applies it to 24 literatures mostly by other researchers.</p><p>The comparator is the paper&rsquo;s own uncorrected mean wherever it states one, which 30 of the 32 do. Otherwise it is the average of that literature&rsquo;s estimates in the data on this site, winsorised at 1%. The paper&rsquo;s own number is preferred because the harmonised table keeps only estimates that report a usable standard error, so a mean computed from it can rest on a subset of what the paper analysed.</p><p>If you distrust means, there is a second reading. 2 of the 32 comparators are computed here instead of quoted from a paper, and those are winsorised means. Use the median of those literatures&rsquo; estimates instead and the overall median revision becomes -46%, with the number moving upward unchanged at 6. The swap is confined to those rows on purpose: where a paper states its own mean, its corrected value need not be in the same units as the estimate column at all, so a median taken from that column would not be a comparator. The check covers only the estimates this site holds, under the same standard-error selection.</p><p><b>The 19 rings</b> are pairs that are approximate in a stated way: the central value of a range, or an upper bound (7), the horizon the paper leads with (4), a number read from a results table where the headline is verbal (5), the subsample the paper leads with (3). Hover a ring and it says which.</p><p><b>32 of the 55 papers qualify.</b> Of the other 23, 8 have no single literature effect to correct: methods papers, an experiment, and the review that supplies the companion figure. The rest answer in words rather than a number, or give a headline that is not a correction at all, or sit against a comparator so near zero that the ratio is noise, or state several corrected values that disagree with each other; three are out because the correction flips the sign, and a ratio of magnitudes across a sign flip would not mean what this figure means, and a literature that already has a dot does not get a second one. The rule takes no account of which way a paper moved, and every one of those 23 is written down with its reason, individually, in <a href="/tools/board/correction_ratios.json">correction_ratios.json</a>.</p><p><b>What best practice means here.</b> Several of these papers do not simply average their estimates. They evaluate their model at the literature&rsquo;s preferred values, for recent data, more observations, and better-cited outlets, and report that as the figure a careful study would have produced. It is the construction these authors use, it is what Gechert et al.&rsquo;s corrected column is built from, and in each case it is the paper&rsquo;s own headline conclusion. The rows concerned name it in the spec.</p><p>Most of these papers correct with estimators that shrink toward zero. What the figure adds is the size of each move.</p></details></figcaption>
