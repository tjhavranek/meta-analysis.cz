<figcaption class="table-note"><b>What meta-analysis did to the number.</b> <b>44 of the 55 papers here can be compared this way</b>: the average of the estimates a literature reports, against the paper&rsquo;s own corrected estimate. <b>Red</b>: smaller <i>in absolute magnitude</i>. <b>Green</b>: larger. <b>31 moved toward zero, 11 away</b> from it. <b>2</b> did not move. The median revision is <b>-41%</b>. Hover a dot for its own numbers.<details class="figmethod"><summary>How this figure is built, what the rings and outlines mean, and which papers it leaves out</summary><p><b>What is plotted.</b> Each dot is one literature. The horizontal position is <i>(|corrected| &minus; |mean|) / |mean|</i>: how far the corrected estimate sits from the uncorrected one, as a fraction of the uncorrected one, in absolute magnitude. Zero means the correction left the size of the number alone; &minus;50% means it halved it; +100% means it doubled it. 2 dots are placed at zero by rule rather than by that formula, because the paper tests for publication bias and reports none worth correcting: FDI spillover determinants, whose two numbers, 0.021 and -0.002, would otherwise divide to +950%, a property of the denominator rather than a finding; habit formation. It is the same relative revision as Table 3 of <a href="/conventional_wisdom/">Gechert et al. (2025)</a>, which applies it to 24 literatures mostly by other researchers. Vertical position carries no meaning: the dots are stacked only to keep them apart.</p><p><b>Where the uncorrected number comes from.</b> The comparator is the uncorrected number. It is chosen by a fixed order, and the first one that exists wins. The paper&rsquo;s own uncorrected mean for the same quantity, which 39 of the 44 state. Failing that, the paper&rsquo;s own uncorrected pooled estimate of it. Failing that, the average of that literature&rsquo;s estimates as released here, winsorised at 1%. And only where a paper reports none of those, the canonical value the paper itself names as the number its field had been working with. The paper&rsquo;s own figure comes first because the harmonised table keeps only estimates that report a usable standard error, so a mean computed from it can rest on a subset of what the paper analysed.</p><p><b>Where the corrected number comes from.</b> Several of these papers do not simply average their estimates. They evaluate their model at the literature&rsquo;s preferred values, for recent data, more observations, and better-cited outlets, and report that as the figure a careful study would have produced. It is the construction these authors use, it is what Gechert et al.&rsquo;s corrected column is built from, and in each case it is the paper&rsquo;s own headline conclusion. The rows concerned say so in their notes in <a href="/tools/board/correction_ratios.json">correction_ratios.json</a>. Most of these papers correct with estimators that shrink toward zero; what the figure adds is the size of each move.</p><p><b>What the marks mean.</b> A solid dot is a pair both of whose numbers the paper states for the same quantity. A ring is a pair that is approximate in a stated way, and hovering it says which way. An outline means the correction did not only change the size of the number but its direction, which an axis of magnitudes cannot show.</p><p><b>44 of the 55 papers qualify.</b> Of the other 11, 7 have no single literature effect to correct: methods papers, an experiment, a survey of other meta-analyses, and the review of 24 literatures named above, whose own figure is on <a href="/conventional_wisdom/">its page</a>. Three share a literature with a paper that already has a dot, and a literature gets one dot. One studies what moves its number rather than the number itself. A reversal of sign is <i>not</i> a reason to leave a paper out. The rule takes no account of which way a paper moved, and every one of those 11 is written down with its reason, individually, in <a href="/tools/board/correction_ratios.json">correction_ratios.json</a>.</p><p><b>If you distrust means</b>, there is a second reading. 3 of the 44 comparators are computed here rather than quoted from a paper. For the 2 of those taken from the harmonised table they are winsorised means; use the median of those literatures&rsquo; estimates instead and the overall median revision becomes -40%, with the number moving upward unchanged at 11. The swap is confined to those rows on purpose: where a paper states its own mean, its corrected value need not be in the same units as the estimate column at all, so a median taken from that column would not be a comparator. The check covers only the estimates this site holds, under the same standard-error selection.</p><p><b>Off the scale.</b> 3 of the dots are drawn at the right-hand edge because their revisions run past the end of it: price puzzle at <b>+394%</b>, structural reforms at <b>+631%</b>, Czech FDI productivity at <b>+826%</b>.</p><p><b>Where the sign reversed.</b> In 4 the correction changed the direction of the number as well as its size: resource curse, forward premium puzzle, bank competition, Czech FDI productivity. Those dots are drawn with an outline and say so when you hover them.</p><p><b>The 32 rings</b> are pairs that are approximate in a stated way: the central value of a range, or an upper bound (7), the horizon the paper leads with (5), a number read from a results table where the headline is verbal (11), the subsample the paper leads with (3), the median of the correction methods the paper reports, where it prefers none of them (2), the worked example a methods paper applies its correction to, rather than a literature of its own (1), a best-practice value the paper evaluates at a preferred data year later than any vintage in its own sample (1), a literature whose own test finds no publication bias to correct, so the corrected value is the reported one (2). Hover a ring and it says which.</p><p><b>Where the base is small.</b> In 3 of the 44 both the reported and the corrected level are economically negligible in the paper&rsquo;s own terms (FDI spillover determinants, bank competition, working while studying), so a large percentage is a large relative change from a small base rather than a large effect.</p></details></figcaption>
