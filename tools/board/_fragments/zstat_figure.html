<p class="table-note"><b>Where the estimates fall.</b> Absolute t-statistics for all 53,123 pooled estimates; the first panel shows the 82% below 6, and the second panel magnifies half a unit around 1.96 on its own vertical scale. In equal 0.05-wide bins ([1.91, 1.96) against [1.96, 2.01), so an estimate reported as exactly 1.96 counts as above) there are <b>561 estimates just below and 689 just above</b>, 1.23 times as many. The observed step is modest, and it is specific to that one threshold: at 1.645 and at 2.576 the count falls as they are crossed instead of jumping. What the picture shows is the shape of the distribution; it does not measure p-hacking. Selective reporting, specification search, and genuinely large effects all leave marks here, and estimates are clustered within studies. The bin counts are in <a href="/data/v1/t_distribution.csv">t_distribution.csv</a>.</p>
